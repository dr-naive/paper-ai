name: paperai

services:
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-paperai-local}@db:5432/paperai
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-paperai-local-dev-secret-key-123456}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?请在 .env 中设置 DEFAULT_ADMIN_PASSWORD}
      - ENABLE_AGENT_RUNTIME_V2=${ENABLE_AGENT_RUNTIME_V2:-true}
      - ENABLE_MEMORY_V2=${ENABLE_MEMORY_V2:-true}
      - ENABLE_WRITING_V2=${ENABLE_WRITING_V2:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    container_name: paperai-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-paperai-local}@db:5432/paperai
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ANSWER_TASK_TTL_SECONDS=${REDIS_ANSWER_TASK_TTL_SECONDS:-86400}
      - REDIS_UPLOAD_TASK_TTL_SECONDS=${REDIS_UPLOAD_TASK_TTL_SECONDS:-604800}
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-paperai-local-dev-secret-key-123456}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?请在 .env 中设置 DEFAULT_ADMIN_PASSWORD}
      - ENABLE_AGENT_RUNTIME_V2=${ENABLE_AGENT_RUNTIME_V2:-true}
      - ENABLE_MEMORY_V2=${ENABLE_MEMORY_V2:-true}
      - ENABLE_WRITING_V2=${ENABLE_WRITING_V2:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173", "http://127.0.0.1:5173"]}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - VISION_MODEL=${VISION_MODEL:-qwen-vl-max}
      - VISION_BASE_URL=${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - VECTOR_STORE_PATH=/app/data/vectorstore
      - FILE_STORAGE_PATH=/app/data/papers
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-52428800}
      # ====== LLM Tracing(零侵入,未设置 key 时完全不生效) ======
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-PaperAI}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - LANGFUSE_PROJECT=${LANGFUSE_PROJECT:-PaperAI}
    volumes:
      - paperai_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: paperai-worker
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-paperai-local}@db:5432/paperai
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ANSWER_TASK_TTL_SECONDS=${REDIS_ANSWER_TASK_TTL_SECONDS:-86400}
      - REDIS_UPLOAD_TASK_TTL_SECONDS=${REDIS_UPLOAD_TASK_TTL_SECONDS:-604800}
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-paperai-local-dev-secret-key-123456}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?请在 .env 中设置 DEFAULT_ADMIN_PASSWORD}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - VISION_MODEL=${VISION_MODEL:-qwen-vl-max}
      - VISION_BASE_URL=${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - VECTOR_STORE_PATH=/app/data/vectorstore
      - FILE_STORAGE_PATH=/app/data/papers
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-52428800}
      # ====== LLM Tracing(worker 同步启用) ======
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-PaperAI}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - LANGFUSE_PROJECT=${LANGFUSE_PROJECT:-PaperAI}
    volumes:
      - paperai_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-paperai-local}
      - POSTGRES_DB=paperai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  paperai_data:
  redis_data:
