[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["assignment", "attr-defined", "arg-type", "return-value", "misc"]
exclude = ["alembic/", "tests/"]
